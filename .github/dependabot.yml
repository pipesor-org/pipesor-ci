version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  - package-ecosystem: github-actions
    directory: /actions/release
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      release-action:
        patterns: ['*']
    commit-message:
      prefix: ci
