name: Image assurance

# Scans the exact archive produced by container-build.yml in the same run: CycloneDX SBOM,
# full vulnerability report and a gate on fixable vulnerabilities of the selected severities.
# Repositories may document reviewed exceptions in a root .trivyignore.yaml file.

on:
  workflow_call:
    inputs:
      artifact:
        description: Image archive artifact from container-build.yml.
        required: true
        type: string
      fail-severities:
        description: Comma-separated severities that block when a fixed version exists.
        required: false
        type: string
        default: HIGH,CRITICAL

permissions: {}

env:
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .trivyignore.yaml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/image

      - name: Verify the handed-over archive
        working-directory: ${{ runner.temp }}/image
        run: sha256sum --check --strict service-image.tar.sha256

      - name: Generate SBOM and vulnerability report
        run: |
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/trivy-cache"
          trivy() {
            docker run --rm \
              -v "$RUNNER_TEMP/image:/image:ro" \
              -v "$RUNNER_TEMP/evidence:/evidence" \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              -v "$GITHUB_WORKSPACE:/src:ro" \
              "$TRIVY_IMAGE" "$@"
          }
          trivy image --quiet --input /image/service-image.tar --format cyclonedx --output /evidence/sbom.cdx.json
          trivy image --quiet --skip-db-update --input /image/service-image.tar --scanners vuln \
            --format json --output /evidence/vulnerabilities.json

      - name: Block fixable vulnerabilities
        env:
          FAIL_SEVERITIES: ${{ inputs.fail-severities }}
        run: |
          ignore=()
          if [ -f .trivyignore.yaml ]; then
            ignore=(--ignorefile /src/.trivyignore.yaml)
          fi
          docker run --rm \
            -v "$RUNNER_TEMP/image:/image:ro" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            "$TRIVY_IMAGE" image --quiet --skip-db-update --input /image/service-image.tar --scanners vuln \
            --severity "$FAIL_SEVERITIES" --ignore-unfixed "${ignore[@]}" --exit-code 1 --format table

      - name: Retain assurance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-assurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: ignore
          retention-days: 90
